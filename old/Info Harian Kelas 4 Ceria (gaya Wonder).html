function out(){me=null;adm=false;try{localStorage.removeItem("pin")}catch(e){}R()}
function pulang(d){const x0=S.ekstra[new Date(d+"T00:00:00").getDay()]||"";const e=S.pulang.find(x=>x.d===d);if(e)return{x:x0,t:e.t,j:e.j,n:"⚠️ Pulang lebih awal"+(e.a?": "+e.a:"")};const w=new Date(d+"T00:00:00").getDay();return{x:x0,j:S.jadwal[w]||"",n:S.jadwal[w]?"Jadwal normal":"Tidak ada jadwal sekolah"}}
function R(){const a=$("app");if(!me&&!adm){a.innerHTML=`<div class="hd"><span class="lg"></span><h1><span class="b1">Info Harian</span><br><span class="b2">Kelas 4 Ceria</span> ✨</h1><div class="m2">SDN Kaliwungu 05</div><div class="pl"><span>📋 Absen</span><span>🏠 Jam Pulang</span><span>🎨 Kegiatan</span><span>📚 PR</span></div></div><div class="c"><h2>Masukkan PIN</h2><div class="row"><input id="pin" type="password" inputmode="numeric" placeholder="PIN dari wali kelas" style="flex:1"><button id="go">Masuk</button></div><div class="m">${err}</div></div>`;$("go").onclick=()=>login($("pin").value);$("pin").onkeydown=e=>{if(e.key==="Enter")login($("pin").value)};return}
a.innerHTML=(adm?A():P())+`<div class="row" style="justify-content:center"><button onclick="out()" style="background:var(--mu)">Keluar</button></div>`+(adm&&dirty?`<div class="sv"><button id="pub">💾 Simpan &amp; Terbitkan</button></div>`:"");if(adm){B();const p=$("pub");if(p)p.onclick=pub}}
function P(){const n=me.n,t=td(),s=(S.absen[t]||{})[n],pl=pulang(t),mo=t.slice(0,7),c={H:0,S:0,I:0,A:0};for(const d in S.absen)if(d.startsWith(mo)&&S.absen[d][n])c[S.absen[d][n]]++;const tot=c.H+c.S+c.I+c.A;
return`<div class="hd"><span class="lg"></span><h1><span class="b1">Halo, Orang Tua</span><br><span class="b2">${esc(n)}!</span> 👋</h1><div class="m2">${fd(t)} • Kelas 4 SDN Kaliwungu 05</div><div class="pl"><span>📋 Absen</span><span>🏠 Jam Pulang</span><span>🎨 Kegiatan</span><span>📚 PR</span></div></div>
<div class="c"><h2>📋 Kehadiran hari ini</h2><span class="st ${s||"N"}">${s?LB[s]:"Belum diabsen"}</span></div>
<div class="c"><h2>🏠 Jam pulang hari ini</h2><div class="big">${pl.j?pl.j+" WIB":"-"}</div><div class="m">${esc(pl.t==="lambat"?pl.n.replace(/Pulang lebih awal/,"Pulang lebih lambat"):pl.n)}</div>${pl.x?`<div class="st I" style="margin-top:8px">🎭 ${esc(pl.x)}</div>`:""}</div>
<div class="c"><h2>🎨 Kegiatan kelas</h2>${S.keg.slice(0,5).map(k=>`<div style="margin-bottom:12px"><div class="m">${fd(k.d)}</div>${esc(k.t)}${k.f?`<img class="ph" src="${k.f}" alt="Foto kegiatan">`:""}</div>`).join("")}</div>
${["PR","Jadwal"].map(k=>IL(k)).join("")}${IU(n)}${["Libur","Info"].map(k=>IL(k)).join("")}
<div class="c"><h2>📊 Rekap bulan ini</h2><div class="g3"><div class="H">Hadir<br>${c.H}</div><div class="S">Sakit<br>${c.S}</div><div class="I">Izin<br>${c.I}</div><div class="A">Alpa<br>${c.A}</div></div><div class="m" style="margin-top:6px">${tot?"Kehadiran "+Math.round(c.H/tot*100)+"% dari "+tot+" hari tercatat":"Belum ada data bulan ini"}</div></div>`}
function A(){const T=[["absen","📋 Absen"],["pulang","🏠 Pulang"],["keg","🎨 Kegiatan"],["info","📣 Info"],["iuran","💰 Iuran"]];let h=`<div class="hd"><span class="lg"></span><h1><span class="b1">Mode</span> <span class="b2">Guru</span> ✏️</h1><div class="m2">Ubah data lalu tekan Simpan &amp; Terbitkan</div></div><div class="tabs">${T.map(x=>`<button class="${tab===x[0]?"on":""}" onclick="tab='${x[0]}';R()">${x[1]}</button>`).join("")}</div>`;
if(tab==="absen"){const a=S.absen[date]||{};h+=`<div class="c"><input type="date" value="${date}" onchange="date=this.value;R()">${S.murid.map(m=>`<div style="margin-top:10px"><b>${esc(m.n)}</b><div class="row ab">${["H","S","I","A"].map(k=>`<button class="${k} ${a[m.n]===k?"on":""}" onclick="setA('${m.n}','${k}')">${LB[k]}</button>`).join("")}</div></div>`).join("")}</div>`}
if(tab==="pulang"){h+=`<div class="c"><h2>Jadwal tetap</h2>${[1,2,3,4,5,6].map(d=>`<div class="row" style="margin:4px 0"><span style="width:70px">${HR[d]}</span><input type="time" value="${S.jadwal[d]||""}" onchange="S.jadwal[${d}]=this.value;dirty=true;R()"><input placeholder="Ekstra (opsional)" value="${esc(S.ekstra[d]||"")}" onchange="S.ekstra[${d}]=this.value;dirty=true;R()" style="flex:1"></div>`).join("")}</div><div class="c"><h2>Pulang lebih awal</h2><div class="row"><input type="date" id="pd" value="${date}"><select id="pt"><option value="awal">Lebih awal</option><option value="lambat">Lebih lambat (ekstrakurikuler)</option></select><input type="time" id="pj"><input id="pa" placeholder="Alasan" style="flex:1"><button onclick="S.pulang.unshift({d:$('pd').value,j:$('pj').value,t:$('pt').value,a:$('pa').value});S.pulang=S.pulang.slice(0,20);dirty=true;R()">Tambah</button></div>${S.pulang.map((p,i)=>`<div class="row" style="margin-top:8px">${fd(p.d)} • ${p.t==="lambat"?"Lebih lambat":"Lebih awal"} ${p.j} • ${esc(p.a)} <button onclick="S.pulang.splice(${i},1);dirty=true;R()" style="background:var(--r)">Hapus</button></div>`).join("")}</div>`}
if(tab==="keg"){h+=`<div class="c"><h2>Kegiatan hari ini</h2><textarea id="kt" placeholder="Hari ini kami belajar..."></textarea><input type="file" id="kf" accept="image/*"><br><button style="margin-top:8px" onclick="addK()">Tambah</button></div>${S.keg.map((k,i)=>`<div class="c"><div class="m">${fd(k.d)}</div>${esc(k.t)}${k.f?`<img class="ph" src="${k.f}" alt="">`:""}<br><button onclick="S.keg.splice(${i},1);dirty=true;R()" style="background:var(--r);margin-top:6px">Hapus</button></div>`).join("")}`}
if(tab==="info"){h+=`<div class="c"><h2>Info baru</h2><select id="ij">${["PR","Jadwal","Libur","Info"].map(x=>`<option>${x}</option>`).join("")}</select><textarea id="it" placeholder="Isi informasi"></textarea><button onclick="S.info.unshift({d:td(),j:$('ij').value,t:$('it').value});S.info=S.info.slice(0,30);dirty=true;R()">Tambah</button></div>${S.info.map((x,i)=>`<div class="c"><b>${esc(x.j)}</b> <span class="m">${fd(x.d)}</span><br>${esc(x.t)}<br><button onclick="S.info.splice(${i},1);dirty=true;R()" style="background:var(--r);margin-top:6px">Hapus</button></div>`).join("")}`}
if(tab==="iuran")h+=IA();return h}
function B(){}
const RP=v=>"Rp "+v.toLocaleString("id-ID");
function IU(n){const l=(S.iuran||{})[n]||[],b=l.filter(x=>!x.s).reduce((a,x)=>a+x.n,0);return`<div class="c" style="border-left:8px solid var(--y)"><h2>💰 Tagihan iuran ${esc(n)}</h2>${l.length?l.map(x=>`<div class="row" style="justify-content:space-between;margin-bottom:8px"><span>${esc(x.t)}<br><b>${RP(x.n)}</b></span><span class="st ${x.s?"H":"S"}">${x.s?"Lunas ✅":"Belum bayar"}</span></div>`).join("")+`<div class="m">${b?"Total belum dibayar: "+RP(b):"Semua tagihan lunas 🎉"}</div>`:`<div class="m">Tidak ada tagihan iuran 👍</div>`}</div>`}
function IA(){return`<div class="c"><h2>Tambah tagihan</h2><div class="row"><select id="im"><option value="*">Semua murid</option>${S.murid.map(m=>`<option>${esc(m.n)}</option>`).join("")}</select><input id="it2" placeholder="Nama tagihan (mis. Kas Nov)" style="flex:1"><input id="in" type="number" inputmode="numeric" placeholder="Nominal Rp" style="width:130px"><button onclick="addI()">Tambah</button></div></div>`+S.murid.map(m=>{const l=(S.iuran||{})[m.n]||[];return`<div class="c"><b>${esc(m.n)}</b>${l.map((x,i)=>`<div class="row" style="margin-top:6px"><span style="flex:1">${esc(x.t)} • ${RP(x.n)}</span><button onclick="tgI('${m.n}',${i})" style="background:${x.s?"var(--g)":"var(--mu)"}">${x.s?"Lunas":"Belum"}</button><button onclick="dlI('${m.n}',${i})" style="background:var(--r)">✕</button></div>`).join("")||`<div class="m">Tidak ada tagihan</div>`}</div>`}).join("")}
function addI(){const t=$("it2").value.trim(),n=+$("in").value,m=$("im").value;if(!t||!n)return;S.iuran=S.iuran||{};(m==="*"?S.murid.map(x=>x.n):[m]).forEach(k=>(S.iuran[k]=S.iuran[k]||[]).push({t,n,s:false}));dirty=true;R()}
function tgI(m,i){S.iuran[m][i].s=!S.iuran[m][i].s;dirty=true;R()}
function dlI(m,i){S.iuran[m].splice(i,1);dirty=true;R()}
const CT={PR:["📚","PR (Pekerjaan Rumah)","var(--b)","Tidak ada PR hari ini 🎉"],Jadwal:["🗓️","Jadwal","var(--g)","Belum ada info jadwal baru"],Iuran:["💰","Iuran","var(--y)","Tidak ada tagihan iuran 👍"],Libur:["🏖️","Libur","var(--r)","Belum ada info libur"],Info:["📣","Informasi dari guru & sekolah","var(--pr)","Belum ada informasi baru"]};
function IL(k){const[ic,lb,co,em]=CT[k],l=S.info.filter(i=>i.j===k).slice(0,5);return`<div class="c" style="border-left:8px solid ${co}"><h2>${ic} ${lb}</h2>${l.length?l.map(i=>`<div style="margin-bottom:8px"><span class="m">${fd(i.d)}</span><br>${esc(i.t)}</div>`).join(""):`<div class="m">${em}</div>`}</div>`}
function setA(n,k){(S.absen[date]=S.absen[date]||{})[n]=S.absen[date][n]===k?undefined:k;dirty=true;R()}
function cmp(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,720/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.6))};i.src=URL.createObjectURL(f)})}
async function addK(){const t=$("kt").value.trim(),f=$("kf").files[0];if(!t&&!f)return;S.keg.unshift({d:td(),t,f:f?await cmp(f):""});S.keg=S.keg.slice(0,30);S.keg.forEach((k,i)=>{if(i>=8)k.f=""});dirty=true;R()}
async function pub(){const b=$("pub");b.textContent="Menerbitkan...";try{const art=await claude.use("artifact");if(!art){b.textContent="Hanya pemilik halaman yang bisa menerbitkan";return}const j=JSON.stringify(S).replace(/</g,"\\u003c");await art.publish(SRC.replace(/(<script id="data"[^>]*>)[\s\S]*?(<\/script>)/,(m,x,y)=>x+j+y))}catch(e){b.textContent="Gagal menerbitkan, coba lagi"}}
let sp="";try{sp=localStorage.getItem("pin")||""}catch(e){}if(sp)login(sp);else R();
</script></body></html>
